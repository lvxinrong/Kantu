- insert:
    - id: archscope-codebase-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codebase_memory_mcp
        transport: stdio
        command: codebase-memory-mcp
        toolCallTimeoutMs: 600000
        failOnStartupError: false
    - id: archscope
      name: dsh-archscope
      config:
        outputDirectory: archscope_docs
        discoveryMaxDepth: 3
        codebaseMemoryServerName: codebase_memory_mcp
        indexMode: moderate
        evidenceProvider: spawn
        systemConcurrency: 4
        registerCommand: true
        registerSystemScanTool: true
        registerStatusTool: true
